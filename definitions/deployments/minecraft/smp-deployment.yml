apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: minecraft 
  name: smp-deployment
  labels:
    app: fabric-smp
spec:
  replicas: 1 # Number of desired Pods
  selector:
    matchLabels:
      app: fabric-smp
  template:
    metadata:
      labels:
        app: fabric-smp
    spec:
      hostNetwork: true
      containers:
      - name: minecraft-smp
        image: ghcr.io/araustin01/mir-registry:mc-smp
        imagePullPolicy: Always
        securityContext:
          privileged: true
          capabilities:
            add:
              - SYS_PTRACE
              - SYS_ADMIN
              - REPTYR
          seccompProfile:
            type: Unconfined
        tty: true
        stdin: true
        env:
        - name: TZ
          value: "America/New_York"
        ports:
        - containerPort: 25565
        - containerPort: 19132
        volumeMounts:
        - mountPath: /minecraft
          name: minecraft-smp-storage
      volumes:
      - name: minecraft-smp-storage
        hostPath:
          path: /shared/minecraft/smp
          type: Directory
      imagePullSecrets:
      - name: ghcr-secret
