apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: alice
  name: ollama-deployment
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        command: ["/bin/bash"]
        args: ["/scripts/startup.sh"]
        ports:
        - containerPort: 11434
        envFrom:
        - configMapRef:
            name: ollama-config
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        - name: startup-script
          mountPath: /scripts
        - name: performance-config
          mountPath: /performance
        resources:
          requests:
            memory: "16Gi"
            cpu: "4000m"
          limits:
            memory: "48Gi"
            cpu: "8000m"
        securityContext:
          capabilities:
            add: ["SYS_NICE", "SYS_RESOURCE"]
        env:
        - name: OMP_NUM_THREADS
          value: "8"
        - name: MKL_NUM_THREADS
          value: "8"
        - name: OPENBLAS_NUM_THREADS
          value: "8"
        - name: VECLIB_MAXIMUM_THREADS
          value: "8"
        readinessProbe:
          httpGet:
            path: /api/version
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/version
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: ["high-cpu", "compute-optimized"]
      tolerations:
      - key: "high-cpu-usage"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-pvc
      - name: startup-script
        configMap:
          name: ollama-startup-script
          defaultMode: 0755
      - name: performance-config
        configMap:
          name: ollama-performance-config
          defaultMode: 0755
