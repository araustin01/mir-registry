apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: alice
  name: ollama-client
  labels:
    app: ollama-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-client
  template:
    metadata:
      labels:
        app: ollama-client
    spec:
      containers:
      - name: ollama-client
        image: python:3.11-slim
        command: ["/bin/bash"]
        args: ["/scripts/entrypoint.sh"]
        env:
        - name: OLLAMA_HOST
          value: "ollama-service"
        - name: OLLAMA_PORT
          value: "11434"
        - name: OLLAMA_URL
          value: "http://ollama-service:11434"
        - name: OLLAMA_DEFAULT_MODEL
          valueFrom:
            configMapKeyRef:
              name: ollama-config
              key: OLLAMA_DEFAULT_MODEL
        volumeMounts:
        - name: client-scripts
          mountPath: /scripts
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
        stdin: true
        tty: true
      volumes:
      - name: client-scripts
        configMap:
          name: ollama-client-scripts
          defaultMode: 0755
