apiVersion: v1
kind: Service
metadata:
  namespace: minecraft
  name: smp-service
  labels:
    app: fabric-smp
  # annotations:
  #   metallb.universe.tf/address-pool: default
  #   metallb.universe.tf/allow-shared-ip: "minecraft-servers"
spec:
  type: LoadBalancer
  # externalTrafficPolicy: Cluster # default is Cluster
  selector:
    app: fabric-smp
  ports:
  - name: minecraft-smp
    protocol: TCP
    port: 25565
    targetPort: 25565
